name: piik

services:
  piik:
    image: ${PIIK_IMAGE:-ghcr.io/tntcrafthim/piik:latest}
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: .env
    environment:
      PIIK_CHANNEL_BIND_ADDRESS: 0.0.0.0
      PIIK_CHANNEL_PORT: 8787
      PIIK_CHANNEL_UDP_PORT: ${PIIK_CHANNEL_UDP_PORT:-8787}
      PIIK_CHANNEL_DATA_DIR: /home/nonroot
      # Single site: seed a new site with a private stable owner key.
      PIIK_CHANNEL_OWNER_KEY: ${PIIK_CHANNEL_OWNER_KEY:-}
      # Several domains: comma-separated name=seed list; omit for a single site.
      PIIK_CHANNEL_DOMAINS: ${PIIK_CHANNEL_DOMAINS:-}
    ports:
      - "127.0.0.1:8787:8787/tcp"
      - "${PIIK_CHANNEL_UDP_PORT:-8787}:${PIIK_CHANNEL_UDP_PORT:-8787}/udp"
    volumes:
      - piik-data:/home/nonroot
      - piik-tmp:/tmp

volumes:
  piik-data:
  piik-tmp:
